name: Tests and security checks

on:
  push:
    branches: [master, main, "audit/**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,test]"
      - name: Compile source
        run: python -m compileall -q agents enclave_guard cli.py enrichment.py simulator.py
      - name: Run Python tests
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify browser demonstration rules
        run: node --test web/tests/*.test.mjs
