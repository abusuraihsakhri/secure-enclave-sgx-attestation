services:
  secure-enclave-sgx-attestation:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      API_TOKEN: "${API_TOKEN:?Set API_TOKEN to a secure random value}"
      MODEL_PROVIDER: mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
